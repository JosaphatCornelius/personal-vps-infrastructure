version: "3"

services:
  postgresql-database:
    image: "postgres:18.6"
    container_name: system-database-postgresql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/
    networks:
      - database_net

volumes:
  postgres_data:
    driver: local

networks:
  database_net:
    external: true
