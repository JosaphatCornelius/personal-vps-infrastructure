- name: AlmaLinux Fresh Config
  hosts: webservers
  become: true
  tasks:
    - name: Apply OS Security Updates
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true
        security: true
        allowerasing: true

    - name: Install Required Utilities and System Packages
      ansible.builtin.dnf:
        name:
          - git
          - firewalld
          - dnf-plugins-core
        state: present

    - name: Start and Enable Firewalld Service
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Allow Required Services Permanently
      ansible.posix.firewalld:
        service: "{{ item }}"
        state: enabled
        permanent: true
        immediate: true
      loop:
        - ssh
        - http
        - https

- name: AlmaLinux Docker Setup
  hosts: webservers
  become: true
  tasks:
    - name: Add Docker CE Repository
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: "0644"

    - name: Install Docker Engine and Plugins
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Start and Enable Docker Service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

- name: AlmaLinux Create Users
  hosts: webservers
  become: true
  tasks:
    - name: Create Users
      ansible.builtin.user:
        name: "github-deploy"
        state: present
        shell: /bin/bash
        create_home: true
        groups:
          - "docker"
        append: true

    - name: Add SSH Public Key for User
      ansible.builtin.authorized_key:
        user: "github-deploy"
        state: present
        key: "{{ lookup('file', '~/.ssh/github-deploy.pub') }}"

- name: AlmaLinux Deploy Docker Compose Infrastructure
  hosts: webservers
  become: true
  vars_files:
    - vars/secrets.yml
  tasks:
    - name: Pull Projects from Github
      ansible.builtin.git:
        repo: "https://github.com/JosaphatCornelius/personal-vps-infrastructure"
        dest: "/opt/personal-vps-infrastructure"
        version: main
        update: true

    - name: Set Correct Permissions for Deployment User
      ansible.builtin.file:
        path: "/opt/personal-vps-infrastructure"
        group: docker
        recurse: true

    - name: Deploy .env Files across Stacks
      ansible.builtin.template:
        src: templates/env.j2
        dest: /opt/personal-vps-infrastructure/{{ item.folder }}/.env
        mode: "0600"
      loop:
        - { folder: "gateway-and-monitoring" }
        - { folder: "docker-compose-databases/postgresql" }
        - { folder: "hoppscotch-api-client" }

    - name: Create Docker Networks
      community.docker.docker_network:
        name: "{{ item.name }}"
        driver: bridge
        ipam_config:
          - subnet: "{{ item.subnet }}"
        state: present
      loop:
        - { name: apisix_frontend, subnet: "172.20.0.0/24" }
        - { name: apisix_backend, subnet: "172.21.0.0/24" }
        - { name: apisix_mgmt, subnet: "172.22.0.0/24" }
        - { name: database_net, subnet: "172.23.0.0/24" }

    - name: Deploy Default Composes
      community.docker.docker_compose_v2:
        project_src: "/opt/personal-vps-infrastructure/{{ item.folder }}"
        state: present
        files:
          - "{{ item.compose_file }}"
      register: compose_output
      loop:
        - {
            folder: "gateway-and-monitoring",
            compose_file: "docker-compose.yml",
          }
        - {
            folder: "docker-compose-databases/postgresql",
            compose_file: "docker-compose.yml",
          }
        - {
            folder: "hoppscotch-api-client",
            compose_file: "docker-compose.yml",
          }

    - name: Debug Compose Output
      ansible.builtin.debug:
        var: compose_output
