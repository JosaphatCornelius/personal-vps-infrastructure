  version: "3"

  services:
    apisix:
      image: apache/apisix:${APISIX_IMAGE_TAG:-3.18.0-debian}
      container_name: system-gateway-apisix
      restart: always
      environment:
        - ADMIN_NAME=${ADMIN_NAME}
        - ADMIN_KEY=${ADMIN_KEY}
        - VIEWER_NAME=${VIEWER_NAME}
        - VIEWER_KEY=${VIEWER_KEY}
      volumes:
        - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      depends_on:
        - etcd
      ## network_mode: host
      ports:
        - "80:9080/tcp"
        - "443:9443/tcp"
        - "127.0.0.1:9180:9180/tcp"
        - "127.0.0.1:9091:9091/tcp"
        - "127.0.0.1:9092:9092/tcp"
      networks:
        apisix_mgmt:
        apisix_frontend:
        apisix_backend:

    etcd:
      image: bitnamilegacy/etcd:3.6.4
      container_name: system-gateway-etcd
      restart: always
      volumes:
        - etcd_data:/bitnami/etcd
      environment:
        ETCD_ENABLE_V2: "true"
        ALLOW_NONE_AUTHENTICATION: "yes"
        ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
        ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
      # ports:
      #   - "2379:2379/tcp"
      networks:
        apisix_mgmt:

    prometheus:
      image: prom/prometheus:v3.14.0
      container_name: system-monitoring-prometheus
      restart: always
      volumes:
        - ./prometheus_conf/prometheus.yml:/etc/prometheus/prometheus.yml
      # ports:
      #   - "9090:9090"
      networks:
        apisix_mgmt:

    grafana:
      image: grafana/grafana:13.2.3
      container_name: system-monitoring-grafana
      restart: always
      # ports:
      #   - "3000:3000"
      volumes:
        - "./grafana_conf/provisioning:/etc/grafana/provisioning"
        - "./grafana_conf/dashboards:/var/lib/grafana/dashboards"
        - "./grafana_conf/config/grafana.ini:/etc/grafana/grafana.ini"
      networks:
        apisix_mgmt:

    node-exporter:
      image: prom/node-exporter:v1.12.1
      container_name: system-node-exporter
      restart: unless-stopped
      command:
        - '--path.rootfs=/host'
        - '--collector.filesystem.ignored-mount-points="^/(dev|proc|sys|var/lib/docker/.+)($$|/)"'
      networks:
        apisix_mgmt:

  networks:
    apisix_mgmt:
      external: true

    apisix_frontend:
      external: true

    apisix_backend:
      external: true

  volumes:
    etcd_data:
      driver: local
